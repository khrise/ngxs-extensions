name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Clean install
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Verify package exports
        run: npm run verify:exports

      - name: Test library
        run: npm run test

  angular20-ngxs20-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ts: ["5.8.2", "5.9.3"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Clean install
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Verify package exports
        run: npm run verify:exports

      - name: Pack local package
        run: npm pack

      - name: Create smoke app and install Angular20 + NGXS20
        run: |
          mkdir smoke-app
          cd smoke-app
          npm init -y
          npm install @angular/core@^20 @angular/common@^20 @angular/compiler@^20 @ngxs/store@^20 rxjs@^7.8 zone.js@^0.15 typescript@${{ matrix.ts }}
          npm install ../ngxs-extensions-decorators-*.tgz
