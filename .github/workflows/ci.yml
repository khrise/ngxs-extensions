name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Clean install
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Verify package exports
        run: npm run verify:exports

      - name: Test library
        run: npm run test

  angular19-ngxs19-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ts: ["5.5.4", "5.6.3"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Clean install
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Verify package exports
        run: npm run verify:exports

      - name: Pack local package
        run: npm pack

      - name: Create smoke app and install Angular19 + NGXS19
        run: |
          mkdir smoke-app
          cd smoke-app
          npm init -y
          npm install @angular/core@^19 @angular/common@^19 @angular/compiler@^19 @ngxs/store@^19 rxjs@^7.8 zone.js@^0.15 typescript@${{ matrix.ts }}
          npm install ../ngxs-extensions-decorators-*.tgz
